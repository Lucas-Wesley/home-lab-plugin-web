<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Homelab</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Homelab</h1>
      <p class="suave">Daqui, qualquer página vai ao Acervo ou vira flashcards; num vídeo do YouTube, vai ao Acervo. Com o botão direito, também um link, sem abrir. O botão no canto da página aparece nos vídeos e nas páginas com frases de exemplo.</p>
    </header>

    <section id="aqui" hidden>
      <h2>Nesta página</h2>
      <p id="aqui-titulo" class="aqui-titulo"></p>
      <div id="acoes" class="acoes"></div>
    </section>

    <section>
      <h2>Enviados</h2>
      <ul id="historico" class="lista"></ul>
      <p id="vazio" class="suave" hidden>Nada enviado ainda.</p>
    </section>

    <details>
      <summary>Ajustes</summary>
      <label>
        <span>Baralho dos flashcards</span>
        <select id="baralho"><option value="novo">Um baralho novo para cada página</option></select>
      </label>
      <p id="erro-baralhos" class="suave erro" hidden></p>
      <label>
        <span>Tipo dos cartões</span>
        <select id="tipo">
          <option value="basico">Inglês → português</option>
          <option value="invertido">Nos dois sentidos</option>
        </select>
      </label>
      <label>
        <span>Endereço do Acervo</span>
        <input id="acervo" type="url" spellcheck="false" />
      </label>
      <label>
        <span>Endereço do Flashcards</span>
        <input id="flashcards" type="url" spellcheck="false" />
      </label>
      <button id="limpar" type="button">Limpar o histórico</button>
    </details>

    <script src="destinos.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
